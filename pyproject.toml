[project]
name = "crypto-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Praveen", email = "praveenknjun12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.18.0",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
